[AccessTransformers]
; Native transport event forwarding and use state; no game header edits required.
Friend=(Class="AFGBuildable", FriendClass="ATeleportLogisticsBuilding")
Friend=(Class="AFGBuildable", FriendClass="ATeleportLogisticsEndpoint")
Friend=(Class="AFGBuildableFactory", FriendClass="ATeleportLogisticsBuilding")
Friend=(Class="AFGBuildableFactory", FriendClass="ATeleportLogisticsHub")
; Personnel Teleporter uses the native portal entry point via its player-owned RCO.
Friend=(Class="AFGBuildable", FriendClass="ATeleportLogisticsTravelHub")
Friend=(Class="AFGBuildableFactory", FriendClass="ATeleportLogisticsTravelHub")
Friend=(Class="AFGCharacterPlayer", FriendClass="UTeleportLogisticsTravelRemote")
; Sign snapping: UFGAttachmentPointComponent keeps mType private, and the rear
; pads exist for the game's own wall signs.
Friend=(Class="UFGAttachmentPointComponent", FriendClass="ATeleportLogisticsBuilding")
Friend=(Class="UFGAttachmentPointComponent", FriendClass="ATeleportLogisticsTravelHub")
