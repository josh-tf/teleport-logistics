name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # scripts/validate.py and scripts/validate-screen-atlas.py import PIL.
      - run: pip install Pillow
      - run: bash scripts/test.sh
